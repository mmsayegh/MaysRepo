name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set Up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install
        
      - name: Run Semantic Release as Root
        env:
          GITHUB_TOKEN: ${{ secrets.MY_SECRET_TOKEN }}
        run: sudo npx semantic-release
